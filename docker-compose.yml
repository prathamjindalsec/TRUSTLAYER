services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Copy .env.example to .env and set MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_APP_USER:?Set MYSQL_APP_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--skip-name-resolve"]
    volumes:
      - mysql-data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      # This is intentionally a loopback-only hackathon/demo stack. Use the `prod` profile only
      # behind a trusted HTTPS proxy with TRUSTLAYER_COOKIE_SECURE=true.
      SPRING_PROFILES_ACTIVE: docker
      TRUSTLAYER_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
      TRUSTLAYER_DB_USERNAME: ${MYSQL_APP_USER}
      TRUSTLAYER_DB_PASSWORD: ${MYSQL_APP_PASSWORD}
      # The Compose database user owns the demo schema so Flyway can migrate it. A deployment
      # must use a separately managed least-privilege migration role.
      TRUSTLAYER_FLYWAY_USERNAME: ${MYSQL_APP_USER}
      TRUSTLAYER_FLYWAY_PASSWORD: ${MYSQL_APP_PASSWORD}
      TRUSTLAYER_JWT_SECRET: ${TRUSTLAYER_JWT_SECRET:?Set TRUSTLAYER_JWT_SECRET in .env}
      TRUSTLAYER_INDICATOR_HASH_SECRET: ${TRUSTLAYER_INDICATOR_HASH_SECRET:?Set TRUSTLAYER_INDICATOR_HASH_SECRET in .env}
      TRUSTLAYER_COOKIE_SECURE: ${TRUSTLAYER_COOKIE_SECURE:-false}
      TRUSTLAYER_EXPOSE_ACTION_TOKENS: ${TRUSTLAYER_EXPOSE_ACTION_TOKENS:-false}
      TRUSTLAYER_SCANNER_MAX_SUBMISSIONS_PER_MINUTE: ${TRUSTLAYER_SCANNER_MAX_SUBMISSIONS_PER_MINUTE:-30}
      TRUSTLAYER_TRANSACTION_MAX_ANALYSES_PER_MINUTE: ${TRUSTLAYER_TRANSACTION_MAX_ANALYSES_PER_MINUTE:-20}
      TRUSTLAYER_THREAT_MAX_REPORTS_PER_MINUTE: ${TRUSTLAYER_THREAT_MAX_REPORTS_PER_MINUTE:-10}
      TRUSTLAYER_EXTENSION_ENABLED: ${TRUSTLAYER_EXTENSION_ENABLED:-false}
      TRUSTLAYER_EXTENSION_CLIENT_ID: ${TRUSTLAYER_EXTENSION_CLIENT_ID:-}
      TRUSTLAYER_EXTENSION_REDIRECT_URI: ${TRUSTLAYER_EXTENSION_REDIRECT_URI:-}
      TRUSTLAYER_EXTENSION_ORIGIN: ${TRUSTLAYER_EXTENSION_ORIGIN:-}
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
