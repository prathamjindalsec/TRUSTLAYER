spring:
  application:
    name: trustlayer-backend
  config:
    # Local secrets live in backend/.env, which is ignored by Git.
    # CI and production supply the same values as environment variables instead.
    import: optional:file:.env[.properties]
  jackson:
    default-property-inclusion: non_null
    deserialization:
      # Transaction simulations use the submitted offset to explain a local-time rule. Do not
      # silently normalize OffsetDateTime values to the server zone before the analyzer sees them.
      adjust-dates-to-context-time-zone: false
  datasource:
    url: ${TRUSTLAYER_DB_URL}
    username: ${TRUSTLAYER_DB_USERNAME}
    password: ${TRUSTLAYER_DB_PASSWORD}
    hikari:
      pool-name: TrustLayerApplicationPool
      minimum-idle: 2
      maximum-pool-size: ${TRUSTLAYER_DB_POOL_SIZE:10}
      connection-timeout: 5000
      validation-timeout: 3000
      max-lifetime: 1740000
  jpa:
    open-in-view: false
    hibernate:
      # Hibernate validates the Flyway-managed schema; it must never create or mutate it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: ${TRUSTLAYER_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    user: ${TRUSTLAYER_FLYWAY_USERNAME}
    password: ${TRUSTLAYER_FLYWAY_PASSWORD}
    clean-disabled: true
    validate-migration-naming: true
  sql:
    init:
      mode: never
  data:
    web:
      pageable:
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: false

info:
  app:
    name: TRUSTLAYER
    description: AI-powered financial fraud detection and cybersecurity platform
    phase: 16

app:
  extension:
    # Disabled unless an exact installed-extension identity is configured. Do not replace these
    # values with wildcards: extension authorization codes are redirect-URI and PKCE bound.
    enabled: ${TRUSTLAYER_EXTENSION_ENABLED:false}
    client-id: ${TRUSTLAYER_EXTENSION_CLIENT_ID:}
    redirect-uri: ${TRUSTLAYER_EXTENSION_REDIRECT_URI:}
    origin: ${TRUSTLAYER_EXTENSION_ORIGIN:}
    authorization-code-ttl: ${TRUSTLAYER_EXTENSION_AUTHORIZATION_CODE_TTL:PT1M}
    access-token-ttl: ${TRUSTLAYER_EXTENSION_ACCESS_TOKEN_TTL:PT5M}
  scanner:
    max-submissions-per-minute: ${TRUSTLAYER_SCANNER_MAX_SUBMISSIONS_PER_MINUTE:30}
  transactions:
    max-analyses-per-minute: ${TRUSTLAYER_TRANSACTION_MAX_ANALYSES_PER_MINUTE:20}
  threat-intelligence:
    max-reports-per-minute: ${TRUSTLAYER_THREAT_MAX_REPORTS_PER_MINUTE:10}
  security:
    jwt:
      issuer: trustlayer
      secret: ${TRUSTLAYER_JWT_SECRET}
      access-token-ttl: ${TRUSTLAYER_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${TRUSTLAYER_REFRESH_TOKEN_TTL:P7D}
    cookies:
      secure: ${TRUSTLAYER_COOKIE_SECURE:false}
      same-site: Strict
    privacy:
      # Set TRUSTLAYER_INDICATOR_HASH_SECRET independently in production. The development
      # fallback avoids breaking an existing local .env while still making hashes keyed.
      indicator-hash-secret: ${TRUSTLAYER_INDICATOR_HASH_SECRET:${TRUSTLAYER_JWT_SECRET}}
    development:
      expose-action-tokens: ${TRUSTLAYER_EXPOSE_ACTION_TOKENS:false}

logging:
  level:
    root: INFO
    com.trustlayer: INFO
