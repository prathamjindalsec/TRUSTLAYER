spring:
  datasource:
    url: jdbc:h2:mem:trustlayer;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  security:
    jwt:
      issuer: trustlayer-test
      secret: cHJvZHVjdGlvbi1ncmFkZS10ZXN0LXNlY3JldC1tdXN0LWJlLWF0LWxlYXN0LTMyLWJ5dGVzLWxvbmc=
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
    cookies:
      secure: false
      same-site: Strict
    privacy:
      indicator-hash-secret: trustlayer-test-indicator-hmac-key-that-is-not-a-production-secret
    development:
      expose-action-tokens: true

logging:
  level:
    org.flywaydb: WARN
